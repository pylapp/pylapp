# https://github.com/JamesIves/github-sponsors-readme-action

name: Update README Sponsors
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: 0 5 1 * * # Each #st day of the month at 05:00
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Sponsors
        uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1.6.1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          file: 'README.md'
          template: '<a href="https://github.com/{{{ login }}}" title="Go to GitHub profile of sponsor {{{ login }}} or on github.com if sponsor is private"><img src="{{{ avatarUrl }}}" width="50px" alt="User avatar of sponsor {{{ login }}} or placeholder if private sponsor" /></a>&nbsp;&nbsp;'
          marker: 'real-sponsors'
          active-only: false
          include-private: true

      - name: Deploy to GitHub 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: '.'